<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>列印</title>
<style>
  body { font: 14px/1.5 -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; color: #111; margin: 0; background: #f4f6f9; }
  .bar { display: flex; gap: 8px; padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; position: sticky; top: 0; }
  .bar button { padding: 8px 16px; border-radius: 8px; border: 1px solid #1d4ed8; background: #1d4ed8; color: #fff; cursor: pointer; font: inherit; }
  .bar span { color: #555; align-self: center; }
  .page { background: #fff; margin: 12px auto; max-width: 780px; padding: 20px 24px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  /* 密碼條 */
  .slips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
  .slip { border: 1px dashed #999; padding: 10px 12px; break-inside: avoid; }
  .slip .cls { font-size: 12px; color: #555; }
  .slip .nm { font-weight: 700; }
  .slip .pw { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 17px; letter-spacing: 1px; margin-top: 4px; }
  .slip .url { font-size: 11px; color: #555; margin-top: 4px; word-break: break-all; }
  .class-title { font-size: 16px; font-weight: 700; margin: 12px 0 6px; }
  /* 結果通知單 */
  .notice { border: 1px solid #999; padding: 16px 20px; margin-bottom: 16px; break-inside: avoid; }
  .notice h2 { margin: 0 0 6px; font-size: 18px; text-align: center; }
  .notice table { width: 100%; border-collapse: collapse; margin: 8px 0; }
  .notice td, .notice th { border: 1px solid #aaa; padding: 5px 8px; text-align: left; }
  .notice th { background: #f0f0f0; width: 20%; white-space: nowrap; }
  .notice .club { font-size: 20px; font-weight: 800; color: #1d4ed8; }
  .notice .sign { display: flex; gap: 24px; margin-top: 18px; }
  .notice .sign div { flex: 1; border-top: 1px solid #333; padding-top: 4px; font-size: 13px; }
  @media print { body { background: #fff; } .bar { display: none; } .page { box-shadow: none; margin: 0; max-width: none; padding: 0; } .class-break { break-before: page; } }
</style>
</head>
<body>
<div class="bar"><button onclick="window.print()">列印／存成 PDF</button><span id="info"></span></div>
<div class="page" id="page"></div>
<script>
(() => {
  const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const page = document.getElementById('page');
  let payload = null;
  try { payload = JSON.parse(sessionStorage.getItem('print_payload') || 'null'); } catch {}
  if (!payload || !payload.items) { page.textContent = '沒有可列印的資料，請從後台重新產生。'; return; }
  const site = location.origin;
  const byClass = items => {
    const m = new Map();
    for (const it of items) { const k = it.class_name || ''; if (!m.has(k)) m.set(k, []); m.get(k).push(it); }
    return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  };
  if (payload.type === 'passwords') {
    document.title = '學生登入密碼條';
    document.getElementById('info').textContent = `共 ${payload.items.length} 張密碼條，每班一頁，沿虛線裁切發給學生`;
    page.innerHTML = byClass(payload.items).map(([cls, list], i) => `
      <div class="class-title ${i ? 'class-break' : ''}">${esc(payload.school)} 社團志願選填 登入密碼 · ${esc(cls) || '未分班'}（${list.length} 人）</div>
      <div class="slips">${list.map(p => `
        <div class="slip">
          <div class="cls">${esc(p.class_name)} ${p.seat_no ? '座號 ' + esc(p.seat_no) : ''}</div>
          <div class="nm">${esc(p.name)}　<span style="font-weight:400">${esc(p.student_id)}</span></div>
          <div class="pw">密碼：${esc(p.password)}</div>
          <div class="url">${esc(site)}</div>
        </div>`).join('')}</div>`).join('');
  } else if (payload.type === 'results') {
    document.title = '社團分發結果通知單';
    document.getElementById('info').textContent = `共 ${payload.items.length} 張通知單`;
    page.innerHTML = byClass(payload.items).map(([cls, list], i) => list.map((r, j) => `
      <div class="notice ${i && j === 0 ? 'class-break' : ''}">
        <h2>${esc(payload.school)} 社團分發結果通知單</h2>
        <table>
          <tr><th>班級／座號</th><td>${esc(r.class_name)}${r.seat_no ? ' / ' + esc(r.seat_no) : ''}</td><th>姓名</th><td>${esc(r.name)}</td><th>學號</th><td>${esc(r.student_id)}</td></tr>
          <tr><th>錄取社團</th><td colspan="5" class="club">${r.club_id ? esc(r.club_name) : (r.lottery == null ? '未填寫志願，請洽學務處' : '所填志願皆額滿，請洽學務處')}</td></tr>
          <tr><th>錄取志願序</th><td>${r.rank ?? '—'}</td><th>指導老師</th><td>${esc(r.teacher || '—')}</td><th>地點</th><td>${esc(r.location || '—')}</td></tr>
        </table>
        <div style="font-size:13px;color:#444">分發方式：以公開抽籤種子進行統一電腦分發，依抽籤順位分到志願序中第一個尚有名額的社團。如有疑問請洽學務處社團活動組。</div>
        <div class="sign"><div>學生簽名</div><div>家長／監護人簽名</div><div>日期</div></div>
      </div>`).join('')).join('');
  } else page.textContent = '不支援的列印類型。';
})();
</script>
</body>
</html>
