<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>社團志願選填</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <h1 id="title">社團志願選填</h1>
  <div class="who hidden" id="who"><span id="whoName"></span><button id="logoutBtn" type="button">登出</button></div>
</header>

<main>
  <!-- 登入 -->
  <section id="loginView" class="login">
    <div class="eyebrow" id="loginSchool">社團志願選填</div>
    <h2>登入以選填社團志願</h2>
    <p class="lead">請使用學校發給的學號與密碼。</p>
    <div id="announceLogin" class="banner info hidden"></div>
    <form id="loginForm">
      <div class="field"><label for="sid">學號</label><input id="sid" type="text" inputmode="numeric" autocomplete="username" required></div>
      <div class="field"><label for="pw">密碼</label><input id="pw" type="password" autocomplete="current-password" required></div>
      <button class="btn primary block" type="submit">登入</button>
      <div class="error" id="loginErr"></div>
    </form>
    <p class="foot">忘記密碼或無法登入，請洽學務處社團活動組。</p>
  </section>

  <!-- 主畫面 -->
  <section id="appView" class="hidden">
    <div class="hero">
      <div>
        <h1>選填社團志願</h1>
        <div id="statusBanner" class="status"></div>
      </div>
      <div class="side hidden" id="submittedCard">
        <span>已送出 <span id="submittedMeta"></span> · 確認碼 <strong id="submittedReceipt"></strong></span>
        <a href="/receipt.html" target="_blank">列印確認單</a>
      </div>
    </div>
    <div id="announce" class="banner info hidden"></div>

    <div id="resultCard" class="card hidden">
      <h2>分發結果</h2>
      <div id="resultBody"></div>
    </div>

    <div class="tabs">
      <button type="button" data-tab="clubs" class="active">社團列表</button>
      <button type="button" data-tab="prefs">我的志願 · <span id="tabCount">0</span></button>
    </div>

    <div class="layout">
      <div class="card" id="clubsPane">
        <h2>社團列表</h2>
        <div class="toolbar">
          <div class="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
            <input id="search" type="text" placeholder="搜尋社團、老師或關鍵字">
          </div>
        </div>
        <div class="chips" id="chips"></div>
        <div id="clubList"></div>
      </div>

      <div class="card pane mobile-hidden" id="prefsPane">
        <div class="pane-head"><h2>我的志願</h2><div class="count"><strong id="prefCount">0</strong> / <span id="prefMax">15</span></div></div>
        <div class="muted small" id="prefHint"></div>
        <div class="progress"><div id="progressBar" style="width:0%"></div></div>
        <ul class="slots" id="slots"></ul>
        <button class="btn primary block" id="submitBtn" type="button">送出志願</button>
        <div class="error" id="submitErr"></div>
        <p class="foot">統一抽籤分發，送出先後不影響結果。截止前可重新送出，以最後一次為準。</p>
      </div>
    </div>

    <div class="mobile-bar" id="mobileBar">
      <div><div class="count">已選 <span id="barCount">0</span> / <span id="barMax">15</span></div><div class="hint" id="barHint"></div></div>
      <button class="btn primary" id="barBtn" type="button">查看志願</button>
    </div>
  </section>
</main>

<div id="modal" class="modal-bg hidden">
  <div class="modal">
    <h2>志願已送出</h2>
    <p class="muted small">請記下確認碼，或列印確認單給家長。</p>
    <div class="receipt" id="modalReceipt"></div>
    <ol id="modalList"></ol>
    <a class="btn block" href="/receipt.html" target="_blank">列印／存成 PDF 確認單</a>
    <button class="btn primary block" id="modalClose" type="button">完成</button>
  </div>
</div>

<footer>社團志願序系統</footer>
<script src="/app.js"></script>
</body>
</html>
