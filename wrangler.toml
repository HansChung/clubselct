# Cloudflare Workers 設定檔
# 部署前請把 database_id 換成 `npx wrangler d1 create clubselect` 回傳的 id
name = "clubselect"
main = "src/index.js"
compatibility_date = "2025-06-01"

# 本機測試：npm run dev 會在 http://<你的IP>:6767 提供服務，同一區網的人可直接連
[dev]
port = 6767
ip = "0.0.0.0"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "clubselect"
database_id = "7ef28a10-f4e8-472a-a3e1-7a1d60830baa"

# 機密請用 `npx wrangler secret put ADMIN_PASSWORD` 與 `npx wrangler secret put SESSION_SECRET` 設定
# 本機開發可放在 .dev.vars（已列入 .gitignore）
[vars]
SCHOOL_NAME = "淡江高中"
